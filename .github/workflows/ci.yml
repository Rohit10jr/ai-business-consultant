# CI: the client-data guard, the test suite, and a byte-compile lint.
#
# The guard job is listed first and runs on every push and PR because it is
# the only check whose failure is unrecoverable if missed: a client corpus in
# git history cannot be taken back. Honest limit: a PR can edit this workflow,
# so the guard catches accidents, not a determined author. Branch protection
# and a human reading the diff remain the real backstop.
#
# Actions are pinned to commit SHAs; the token is read-only.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-data-guard:
    name: Client-data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python tools/check_no_client_data.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Stdlib only, by design: catches syntax errors and the 3.11 floor
      # without adding a dependency the project would otherwise not have.
      - run: python -m compileall -q tools tests fixtures
